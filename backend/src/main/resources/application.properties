spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/dore}
spring.datasource.username=${DB_USER:dore}
spring.datasource.password=${DB_PASSWORD:dore}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8081}
app.user=${APP_USER:admin}
app.password=${APP_PASSWORD:}
app.demo-data=${APP_DEMO_DATA:false}
app.gemini.key=${GEMINI_API_KEY:}
app.gemini.models=${ASSISTANT_GEMINI_MODELS:gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.8-flash}
